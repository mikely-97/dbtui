[project]
name = "dbt-tui"
version = "0.5.0"
description = "Terminal UI for exploring and managing dbt projects"
authors = [
    {name = "Mike", email = "sortia@protonmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12, <4.0"
keywords = ["dbt", "tui", "terminal", "data", "analytics", "sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "pyyaml>=6.0.3,<7.0.0",
    "ruamel.yaml>=0.18.0,<0.19.0",
    "textual[syntax]>=6.5.0,<7.0.0",
    "platformdirs>=4.5.0,<5.0.0",
    "networkx>=3.0",
    "jinja2>=3.0",
    "watchdog>=4.0.0,<5.0.0",
    "sqlglot>=25.0",
]

[project.urls]
Homepage = "https://github.com/mikely-97/dbtui"
Repository = "https://github.com/mikely-97/dbtui"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[project.scripts]
dbt-tui = "dbt_tui.__main__:main"

[tool.poetry]
packages = [{include = "dbt_tui", from = "src"}]
exclude = ["src/dbt_tui/frontend/pseudo/", "src/dbt_tui/frontend/lorem.txt"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name
    "B008",   # function call in default argument
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["dbt_tui"]
