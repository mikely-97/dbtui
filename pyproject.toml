[project]
name = "dbt-tui"
version = "0.2.1"
description = "Terminal UI for exploring and managing dbt projects"
authors = [
    {name = "Mike", email = "sortia@protonmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12, <4.0"
keywords = ["dbt", "tui", "terminal", "data", "analytics", "sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "pyyaml>=6.0.3,<7.0.0",
    "textual[syntax]>=6.5.0,<7.0.0",
    "platformdirs>=4.5.0,<5.0.0",
    "networkx>=3.0",
    "jinja2>=3.0",
]

[project.urls]
Homepage = "https://github.com/sortia/dbt-tui"
Repository = "https://github.com/sortia/dbt-tui"

[project.scripts]
dbt-tui = "dbt_tui.__main__:main"

[tool.poetry]
packages = [{include = "dbt_tui", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
